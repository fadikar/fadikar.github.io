title: "Arindam Fadikar"
url: "https://fadikar.com"
description: "Assistant Computational Statistician at Argonne National Laboratory. Research on uncertainty quantification, calibration of stochastic computer models, and scalable methods for scientific simulation."
og_image: "/images/profile/cover.jpg"

# Bump to invalidate cached CSS in browsers
css_version: "20260518b"

# Files Jekyll should not copy into the built site
exclude:
  - README.md
  - CUSTOMIZATION_GUIDE.md
  - SETUP_SUMMARY.md
  - THEME_GUIDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .claude
  - CLAUDE.md
  - .eslintrc
  - .nvmrc

# Make sure dotfiles like CNAME still get published
include:
  - CNAME
